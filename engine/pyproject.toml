[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fundlens-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
  "Pillow>=10,<13",
  "akshare>=1.17,<2",
  "baostock>=0.8.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-timeout>=2,<3", "jsonschema>=4,<5", "ruff>=0.12,<1", "mypy>=1.15,<2", "pip-tools>=7,<8", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "-m 'not live'"
markers = [
  "live: opt-in tests that call real network providers (run with: python -m pytest -m live)",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

