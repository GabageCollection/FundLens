<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120">
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D8A86"/><stop offset=".18" stop-color="#9FA7A3"/>
      <stop offset=".32" stop-color="#625BD4"/><stop offset=".56" stop-color="#827BE6"/>
      <stop offset=".72" stop-color="#2E8162"/><stop offset=".88" stop-color="#D2A05B"/><stop offset="1" stop-color="#C54B40"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#625BD4"/><stop offset="1" stop-color="#2E8162"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#08100d" flood-opacity=".16"/></filter>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#121817}
      .display{font-family:"Noto Serif CJK SC","Source Han Serif SC","Microsoft YaHei",serif;font-weight:600}
      .mono{font-family:"IBM Plex Mono","Roboto Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
      .white{fill:#fff}.muted{fill:#68736f}.faint{fill:#919b97}.indigo{fill:#625BD4}.profit{fill:#C54B40}.loss{fill:#2E8162}
      .h1{font-size:34px}.h2{font-size:24px}.h3{font-size:18px;font-weight:650}.body{font-size:15px}.small{font-size:13px}.tiny{font-size:11px}.number{font-size:42px;font-weight:550;letter-spacing:-2px}.mnumber{font-size:31px;font-weight:550;letter-spacing:-1px}
    </style>
  </defs>

